<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lavasecarropa Whirlpool WCN95</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-deep: #0D2340; --blue-mid: #1B4F8A; --blue-light: #2E7DD4;
    --blue-pale: #D6E8FA; --accent: #F0A500; --white: #FFFFFF;
    --off-white: #F4F7FB; --text: #0D2340; --text-light: #4A6080;
    --success: #0B7A56; --radius: 16px; --shadow: 0 8px 32px rgba(13,35,64,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--off-white); color:var(--text); min-height:100vh; overflow-x:hidden; }
  .screen { display:none; min-height:100vh; flex-direction:column; }
  .screen.active { display:flex; }

  #home { background:linear-gradient(160deg,var(--blue-deep) 0%,var(--blue-mid) 55%,var(--blue-light) 100%); align-items:center; justify-content:center; padding:40px 24px; position:relative; overflow:hidden; }
  #home::before { content:''; position:absolute; top:-80px; right:-80px; width:320px; height:320px; background:radial-gradient(circle,rgba(240,165,0,.18) 0%,transparent 70%); border-radius:50%; }
  #home::after  { content:''; position:absolute; bottom:-60px; left:-60px; width:260px; height:260px; background:radial-gradient(circle,rgba(255,255,255,.06) 0%,transparent 70%); border-radius:50%; }
  .home-inner { position:relative; z-index:1; text-align:center; width:100%; max-width:400px; }
  .brand-badge { display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); border-radius:100px; padding:6px 16px; font-size:12px; color:rgba(255,255,255,.85); letter-spacing:.08em; text-transform:uppercase; font-weight:500; margin-bottom:28px; }
  .brand-badge::before { content:''; width:8px; height:8px; background:var(--accent); border-radius:50%; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.3)} }
  .machine-icon { width:100px; height:100px; margin:0 auto 24px; background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.2); border-radius:24px; display:flex; align-items:center; justify-content:center; font-size:52px; backdrop-filter:blur(10px); box-shadow:0 8px 24px rgba(0,0,0,.2); }
  .home-title { font-family:'DM Serif Display',serif; font-size:clamp(26px,7vw,34px); color:var(--white); line-height:1.15; margin-bottom:8px; }
  .home-model { font-size:14px; color:var(--accent); font-weight:600; letter-spacing:.12em; text-transform:uppercase; margin-bottom:40px; }
  .lang-label { font-size:13px; color:rgba(255,255,255,.6); letter-spacing:.06em; text-transform:uppercase; font-weight:500; margin-bottom:16px; }
  .lang-grid { display:flex; flex-direction:column; gap:12px; width:100%; }
  .lang-btn { display:flex; align-items:center; gap:16px; background:rgba(255,255,255,.10); border:1.5px solid rgba(255,255,255,.18); border-radius:14px; padding:16px 20px; cursor:pointer; transition:all .22s ease; text-align:left; color:var(--white); width:100%; }
  .lang-btn:hover,.lang-btn:active { background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.38); transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.25); }
  .lang-flag { width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .lang-info { flex:1; }
  .lang-name { font-size:17px; font-weight:600; display:block; margin-bottom:2px; }
  .lang-native { font-size:13px; color:rgba(255,255,255,.55); }
  .lang-arrow { font-size:18px; color:var(--accent); opacity:.8; }

  #guide { background:var(--off-white); flex-direction:column; }
  .guide-header { background:linear-gradient(135deg,var(--blue-deep) 0%,var(--blue-mid) 100%); padding:20px 20px 28px; position:relative; overflow:hidden; }
  .guide-header::after { content:''; position:absolute; bottom:-20px; left:0; right:0; height:40px; background:var(--off-white); border-radius:40px 40px 0 0; }
  .header-top { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .back-btn { width:36px; height:36px; background:rgba(255,255,255,.15); border:none; border-radius:10px; color:white; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .back-btn:hover { background:rgba(255,255,255,.25); }
  .header-title { font-family:'DM Serif Display',serif; font-size:20px; color:white; line-height:1.2; }
  .header-subtitle { font-size:12px; color:rgba(255,255,255,.6); margin-top:2px; }

  .tabs-wrapper { padding:0 20px; margin-top:8px; position:relative; z-index:2; }
  .tabs { display:flex; gap:8px; background:var(--white); padding:5px; border-radius:14px; box-shadow:var(--shadow); }
  .tab { flex:1; padding:10px 6px; border:none; background:transparent; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; color:var(--text-light); cursor:pointer; transition:all .22s ease; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .tab .tab-icon { font-size:18px; }
  .tab.active { background:var(--blue-deep); color:var(--white); box-shadow:0 4px 12px rgba(13,35,64,.25); }

  .content { flex:1; padding:20px; overflow-y:auto; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  .section-title { font-family:'DM Serif Display',serif; font-size:22px; color:var(--blue-deep); margin-bottom:4px; }
  .section-desc { font-size:14px; color:var(--text-light); margin-bottom:20px; line-height:1.5; }
  .card { background:var(--white); border-radius:var(--radius); padding:20px; margin-bottom:14px; box-shadow:0 2px 12px rgba(13,35,64,.07); border:1px solid rgba(13,35,64,.05); }
  .step-badge { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; background:var(--blue-deep); color:white; border-radius:8px; font-size:13px; font-weight:700; flex-shrink:0; }
  .step-header { display:flex; align-items:flex-start; gap:12px; margin-bottom:8px; }
  .step-title { font-size:16px; font-weight:600; color:var(--blue-deep); line-height:1.3; flex:1; padding-top:4px; }
  .step-body { font-size:14px; color:var(--text-light); line-height:1.6; padding-left:40px; }
  .alert-card { background:#FFF8E6; border:1.5px solid #F0A500; border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; display:flex; gap:12px; align-items:flex-start; }
  .alert-icon { font-size:20px; flex-shrink:0; }
  .alert-text { font-size:13px; color:#6B4C00; line-height:1.55; }
  .alert-text strong { display:block; margin-bottom:3px; font-weight:600; color:#4A3400; }
  .info-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--off-white); gap:12px; }
  .info-row:last-child { border-bottom:none; }
  .info-label { font-size:13px; color:var(--text-light); flex:1; }
  .info-value { font-size:14px; font-weight:600; color:var(--blue-deep); text-align:right; }
  .success-card { background:linear-gradient(135deg,#EAF7F1,#D4F0E5); border:1.5px solid #0B7A56; border-radius:var(--radius); padding:16px 20px; margin-bottom:14px; display:flex; gap:14px; align-items:center; }
  .success-icon { font-size:26px; }
  .success-text { font-size:14px; color:#0B5A40; line-height:1.5; }
  .success-text strong { display:block; font-size:16px; margin-bottom:2px; font-weight:700; }
  .tab-panel.active > * { animation:slideUp .3s ease both; }
  @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .home-inner > * { animation:fadeInDown .5s ease both; }
  @keyframes fadeInDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:translateY(0)} }
  #loading { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--blue-deep); color:white; font-size:16px; gap:12px; }
  .spinner { width:24px; height:24px; border:3px solid rgba(255,255,255,.3); border-top-color:white; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* ── EDIT MODE ── */
  #edit-fab {
    position:fixed; bottom:24px; right:24px; z-index:999;
    width:52px; height:52px; border-radius:50%;
    background:var(--blue-deep); color:white;
    border:none; font-size:22px; cursor:pointer;
    box-shadow:0 4px 16px rgba(13,35,64,.4);
    display:none; align-items:center; justify-content:center;
    transition:background .2s, transform .2s;
  }
  #edit-fab.visible { display:flex; }
  #edit-fab.active  { background:#C0392B; transform:rotate(45deg); }

  #edit-bar {
    position:fixed; bottom:88px; right:24px; z-index:998;
    display:none; flex-direction:column; gap:8px; align-items:flex-end;
  }
  #edit-bar.visible { display:flex; }

  .edit-action {
    display:flex; align-items:center; gap:10px;
    background:var(--blue-deep); color:white;
    border:none; border-radius:100px;
    padding:10px 18px; font-size:13px; font-weight:600;
    cursor:pointer; box-shadow:0 4px 14px rgba(13,35,64,.35);
    transition:background .2s;
    font-family:'DM Sans',sans-serif;
  }
  .edit-action:hover { background:var(--blue-mid); }
  .edit-action.green { background:#0B7A56; }
  .edit-action.green:hover { background:#08623F; }

  /* Editable elements */
  body.edit-mode [data-edit] {
    outline:2px dashed var(--accent);
    outline-offset:3px;
    border-radius:4px;
    cursor:text;
    position:relative;
  }
  body.edit-mode [data-edit]:focus {
    outline:2px solid var(--accent);
    background:rgba(240,165,0,.08);
  }
  body.edit-mode [data-edit]:hover::after {
    content:'✏️';
    position:absolute;
    top:-10px; right:-6px;
    font-size:12px;
    pointer-events:none;
  }

  .edit-toast {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    background:var(--blue-deep); color:white;
    padding:10px 20px; border-radius:100px;
    font-size:13px; font-weight:500;
    z-index:1000; opacity:0;
    transition:opacity .3s;
    pointer-events:none;
    white-space:nowrap;
  }
  .edit-toast.show { opacity:1; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div> Cargando...</div>
<div class="edit-toast" id="toast"></div>
<button id="edit-fab" onclick="toggleEditMode()" title="Modo edición">✏️</button>
<div id="edit-bar">
  <button class="edit-action green" onclick="exportJSON()">⬇️ Exportar JSON</button>
  <button class="edit-action" onclick="addStep()">＋ Agregar paso</button>
  <button class="edit-action" onclick="deleteLastStep()">🗑 Borrar último paso</button>
</div>

function loadContent() {
  DATA = JSON.parse(JSON.stringify(CONTENT));
  document.getElementById('loading').style.display = 'none';
  document.getElementById('home').classList.add('active');
}

// ── Navigation ────────────────────────────────────────────────
function openGuide(lang) {
  currentLang = lang;
  renderGuide(lang);
  document.getElementById('home').classList.remove('active');
  document.getElementById('guide').classList.add('active');
  document.getElementById('edit-fab').classList.add('visible');
  if (editMode) applyEditMode();
}

function goHome() {
  saveEdits();
  document.getElementById('guide').classList.remove('active');
  document.getElementById('home').classList.add('active');
  document.getElementById('edit-fab').classList.remove('visible');
  document.getElementById('edit-bar').classList.remove('visible');
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  if (editMode) applyEditMode();
}

// ── Render ────────────────────────────────────────────────────
function renderGuide(lang) {
  const L = DATA[lang];
  if (!L) return;
  document.getElementById('panel-lavado').innerHTML = buildLavado(L.lavado);
}

function buildSteps(pasos, section) {
  return pasos.map((p, i) => `
    <div class="card" data-section="${section}" data-step="${i}">
      <div class="step-header">
        <span class="step-badge">${i+1}</span>
        <span class="step-title" data-edit="${section}.pasos.${i}.titulo" contenteditable="false">${x(p.titulo)}</span>
      </div>
      <p class="step-body" data-edit="${section}.pasos.${i}.cuerpo" contenteditable="false">${x(p.cuerpo)}</p>
      ${p.imagen ? `<img src="${p.imagen}" alt="Paso ${i+1}" style="display:block;margin-top:12px;border-radius:8px;${i===0?'width:100%;max-width:100%;':'width:80px;height:auto;margin-left:auto;margin-right:auto;'}">` : ''}
    </div>`).join('');
}

function buildLavado(l) {
  return `
    <p class="section-title" data-edit="lavado.titulo" contenteditable="false">${x(l.titulo)}</p>
    <p class="section-desc"  data-edit="lavado.descripcion" contenteditable="false">${x(l.descripcion)}</p>
    <div class="alert-card">
      <span class="alert-icon">⚠️</span>
      <div class="alert-text">
        <strong data-edit="lavado.alertaTitulo" contenteditable="false">${x(l.alertaTitulo)}</strong>
        <span   data-edit="lavado.alertaTexto"  contenteditable="false">${x(l.alertaTexto)}</span>
      </div>
    </div>
    ${buildSteps(l.pasos, 'lavado')}`;
}

// ── Edit mode ─────────────────────────────────────────────────
function toggleEditMode() {
  if (editMode) {
    saveEdits();
    editMode = false;
    document.body.classList.remove('edit-mode');
    document.querySelectorAll('[data-edit]').forEach(el => el.contentEditable = 'false');
    document.getElementById('edit-fab').classList.remove('active');
    document.getElementById('edit-fab').textContent = '✏️';
    document.getElementById('edit-bar').classList.remove('visible');
    toast('Cambios guardados ✓');
  } else {
    editMode = true;
    document.body.classList.add('edit-mode');
    applyEditMode();
    document.getElementById('edit-fab').classList.add('active');
    document.getElementById('edit-fab').textContent = '✕';
    document.getElementById('edit-bar').classList.add('visible');
    toast('Modo edición activado — tocá cualquier texto');
  }
}

function applyEditMode() {
  document.querySelectorAll('[data-edit]').forEach(el => { el.contentEditable = 'true'; });
}

function saveEdits() {
  document.querySelectorAll('[data-edit]').forEach(el => {
    const path = el.getAttribute('data-edit').split('.');
    let obj = DATA[currentLang];
    for (let i = 0; i < path.length - 1; i++) {
      const key = isNaN(path[i]) ? path[i] : parseInt(path[i]);
      obj = obj[key];
    }
    const lastKey = path[path.length - 1];
    obj[isNaN(lastKey) ? lastKey : parseInt(lastKey)] = el.textContent.trim();
  });
}

function addStep() {
  saveEdits();
  DATA[currentLang].lavado.pasos.push({titulo: 'Nuevo paso', cuerpo: 'Descripción del paso.'});
  renderGuide(currentLang);
  applyEditMode();
  toast('Paso agregado');
}

function deleteLastStep() {
  saveEdits();
  const pasos = DATA[currentLang].lavado.pasos;
  if (pasos.length <= 1) { toast('Debe quedar al menos 1 paso'); return; }
  pasos.pop();
  renderGuide(currentLang);
  applyEditMode();
  toast('Último paso eliminado');
}

function exportJSON() {
  saveEdits();
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'contenido.json';
  a.click();
  toast('JSON exportado ✓');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function x(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadContent();
</script>
